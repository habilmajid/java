# Optional Render Blueprint. No passwords are hard-coded here.
services:
  - type: web
    name: zanzibar-smart-school
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: COOKIE_SECURE
        value: '1'
      - key: DEMO_SEED
        value: '0'
